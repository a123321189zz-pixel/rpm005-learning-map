<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Map v2 · NOBOOKTOMAP</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0b0f1a;
    --panel: #131a2a;
    --panel-2: #182033;
    --panel-3: #1f2940;
    --text: #f7f7fb;
    --muted: #9ca8bf;
    --line: #2b3652;
    --purple: #8f5cff;       /* RESERVED: foundation edge semantic — do not use in UI chrome */
    --purple-soft: #b48cff;  /* UI accent: hover / active / focus states */
    --blue: #4f8cff;
    --teal: #35d3c4;
    --green: #35d39d;
    --gold: #ffd166;
    --red: #ff5d68;
    --orange: #ff8c42;
    --gray: #8492b0;
    /* Node type visual encoding (redundant: hue × shape × border) */
    --n-concept: #4f8cff;
    --n-action:  #35d39d;
    --n-tool:    #8492b0;
    --n-risk:    #ff5d68;
    --n-output:  #ffd166;
    /* Edge type colors */
    --e-foundation: #8f5cff;
    --e-depends_on: #4f8cff;
    --e-influences: #9ca8bf;
    --e-extends:    #b48cff;
    --e-contains:   #ffd166;
    --e-blocks:     #ff5d68;
    --e-validates:  #35d39d;
  }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  button, textarea { font: inherit; color: inherit; }
  .app {
    display: grid;
    grid-template-columns: minmax(260px, 25%) minmax(300px, 25%) minmax(460px, 50%);
    height: 100vh;
  }
  .sidebar, .detail {
    background: var(--panel);
    overflow: auto;
  }
  .sidebar { border-right: 1px solid var(--line); padding: 22px 18px; }
  .detail  { border-right: 1px solid var(--line); padding: 22px; }
  .map {
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #131a2a 0%, #0b0f1a 70%);
  }
  /* ============================================================
     Font hierarchy (4 levels, per visual-design-rules)
       L1 22px - title (h1)
       L2 16px - section heading (h2, h3)
       L3 13px - body text
       L4 11px - labels / captions / chips
       Exception 9px - canvas micro text only (edge-label, name-en)
     ============================================================ */
  h1, h2, h3, h4, p { margin: 0; }
  h1 { font-size: 22px; line-height: 1.3; }
  h2 { font-size: 16px; line-height: 1.4; }
  h3 { font-size: 16px; line-height: 1.4; }
  .summary { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .section-title {
    margin: 22px 0 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  /* Trail list */
  .trail-list { display: grid; gap: 8px; }
  .trail-button {
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .trail-button:hover { border-color: var(--purple-soft); background: #b48cff14; }
  .trail-button.active { border-color: var(--purple-soft); background: #b48cff24; }
  .trail-button strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .trail-button span { display: block; color: var(--muted); font-size: 11px; line-height: 1.5; }
  /* Progress */
  .progress {
    margin-top: 16px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .progress-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .progress-bar { height: 6px; margin-top: 8px; overflow: hidden; background: var(--bg); border-radius: 999px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .3s; }
  /* Legend */
  .legend { margin-top: 18px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .legend-grid { display: grid; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .legend-swatch {
    width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
  }
  .legend-swatch svg { width: 100%; height: 100%; }
  /* Detail panel */
  .detail-empty { color: var(--muted); font-size: 13px; line-height: 1.7; }
  .node-type-chip {
    display: inline-block;
    padding: 2px 10px;
    margin-bottom: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .feynman {
    margin: 14px 0;
    padding: 12px 14px;
    color: var(--text);
    background: var(--panel-2);
    border-left: 3px solid var(--purple-soft);
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.7;
  }
  /* lightbulb prefix removed per user preference */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel-3);
    border-radius: 4px;
  }
  /* Collapsible section */
  details { margin-top: 12px; }
  details summary {
    cursor: pointer;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    list-style: none;
    user-select: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; display: inline-block; transition: transform .15s; }
  details[open] summary::before { content: "▾ "; }
  details summary:hover { color: var(--text); border-color: var(--purple-soft); }
  details > div { padding: 12px 4px 4px; font-size: 13px; line-height: 1.7; }
  details ul { margin: 6px 0; padding-left: 22px; }
  details li { margin: 4px 0; }
  .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .confusion { color: var(--orange); }
  /* P0: risk node common_confusion always-on banner */
  .risk-alert {
    margin: 14px 0;
    padding: 12px 14px;
    background: #ff5d6814;
    border: 2px solid var(--red);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.7;
  }
  .risk-alert::before { content: "⚠️ "; font-size: 14px; }
  .risk-alert .label { display: block; margin-bottom: 4px; color: var(--red); }
  .resources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .resource-chip {
    padding: 3px 8px;
    font-size: 11px;
    color: var(--purple-soft);
    background: #8f5cff1a;
    border: 1px solid #8f5cff44;
    border-radius: 4px;
  }
  /* Status badge */
  .status-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .status-not_started  { background: #2b365266; color: var(--muted); }
  .status-in_progress  { background: #4f8cff33; color: var(--blue); }
  .status-completed    { background: #35d39d33; color: var(--green); }
  .status-stuck        { background: #ff5d6833; color: var(--red); }
  /* Status control buttons in detail panel */
  .status-controls { margin-top: 14px; }
  .status-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .status-btns button {
    flex: 1;
    min-width: 64px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
  }
  .status-btns button:hover { color: var(--text); }
  .status-btns button.active { color: var(--text); font-weight: 700; }
  .status-btns button.active[data-status="not_started"] { border-color: var(--muted); background: #2b365266; }
  .status-btns button.active[data-status="in_progress"] { border-color: var(--blue);  background: #4f8cff33; }
  .status-btns button.active[data-status="completed"]   { border-color: var(--green); background: #35d39d33; }
  .status-btns button.active[data-status="stuck"]       { border-color: var(--red);   background: #ff5d6833; }
  /* Map canvas */
  #graph { width: 100%; height: 100%; cursor: grab; }
  #graph:active { cursor: grabbing; }
  .node-shape { stroke-width: 2px; transition: stroke-width .15s, filter .15s; cursor: pointer; }
  .node-shape:hover { filter: drop-shadow(0 0 8px currentColor); }
  .node-shape.selected { stroke-width: 4px; filter: drop-shadow(0 0 12px currentColor); }
  .node-shape.dimmed { opacity: 0.35; }
  .node-shape.risk { filter: drop-shadow(0 0 6px var(--n-risk)); }
  .node-label {
    fill: var(--text);
    font-size: 11px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node-feynman {
    fill: var(--muted);
    font-size: 11px;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node-label.dimmed, .node-feynman.dimmed { opacity: 0.4; }
  .node-label tspan.name-en {
    font-size: 9px;
    font-weight: 400;
    fill: var(--muted);
  }
  .detail-name-en {
    margin-top: 2px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .edge { fill: none; pointer-events: none; transition: opacity .15s; }
  .edge.dimmed { opacity: 0.12; }
  .edge-label {
    fill: var(--muted);
    font-size: 9px;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 2px;
    stroke-linejoin: round;
  }
  .edge-label.dimmed { opacity: 0.15; }
  /* Map overlay */
  .map-toolbar {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 6px;
    z-index: 10;
  }
  .map-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .map-btn:hover { color: var(--text); border-color: var(--purple-soft); }
  .map-btn.active { color: var(--purple-soft); border-color: var(--purple-soft); }
  .map-btn svg { width: 18px; height: 18px; display: block; }
  /* P2: trail stepper bar (shows trail step order when a trail is active) */
  .trail-stepper {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 240px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    z-index: 8;
    white-space: nowrap;
    font-size: 11px;
  }
  .stepper-trail-name {
    color: var(--purple-soft);
    font-weight: 700;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .stepper-step {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--panel-3);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
  }
  .stepper-step:hover { color: var(--text); border-color: var(--purple-soft); }
  .stepper-step.selected { color: var(--text); border-color: var(--purple-soft); background: #b48cff24; }
  .stepper-step.completed { color: var(--green); border-color: var(--green); }
  .stepper-step.stuck { color: var(--red); border-color: var(--red); }
  .step-num {
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg);
    border: 1px solid currentColor;
    border-radius: 50%;
    font-weight: 700;
    font-size: 11px;
  }
  .stepper-step.completed .step-num { background: var(--green); color: var(--bg); border-color: var(--green); }
  .step-arrow {
    color: var(--muted);
    user-select: none;
    flex-shrink: 0;
  }
  .map-status {
    position: absolute;
    bottom: 14px;
    left: 14px;
    padding: 6px 12px;
    color: var(--muted);
    font-size: 11px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    z-index: 10;
  }
  .error-banner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    background: var(--bg);
    z-index: 100;
  }
  .error-banner div { max-width: 500px; }
  .error-banner h2 { color: var(--red); margin-bottom: 12px; }
  .error-banner code {
    display: inline-block;
    margin: 10px 4px;
    padding: 4px 10px;
    color: var(--gold);
    background: var(--panel);
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--purple-soft); }
  /* P1: Initial loading splash */
  .loading-splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    z-index: 9999;
    transition: opacity .35s ease-out;
  }
  .loading-splash.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--line);
    border-top-color: var(--purple-soft);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading-splash" id="loading-splash">
  <div class="loading-spinner"></div>
  <div>載入中…</div>
</div>
<div class="app">
  <!-- Column 1: Sidebar -->
  <aside class="sidebar">
    <h1 id="title">Learning Map</h1>
    <p class="summary" id="summary"></p>

    <div class="section-title">學習路徑 Trails</div>
    <div class="trail-list" id="trail-list"></div>

    <div class="progress" id="progress-block" style="display:none;">
      <div class="progress-row">
        <span id="progress-label">整體進度</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="section-title">圖例 Legend</div>
    <div class="legend">
      <div class="label" style="margin-bottom:8px;">節點類型</div>
      <div class="legend-grid" id="legend-nodes"></div>
      <div class="label" style="margin:14px 0 8px;">邊類型</div>
      <div class="legend-grid" id="legend-edges"></div>
    </div>
  </aside>

  <!-- Column 2: Detail panel -->
  <section class="detail" id="detail">
    <div class="detail-empty">
      <h2>👈 點擊地圖上的節點查看詳情</h2>
      <p style="margin-top:12px;">
        每個節點預設只顯示「名稱 + 比喻 + 類型」，點擊下方折疊區可漸進展開細節與額外補充。
      </p>
    </div>
  </section>

  <!-- Column 3: Map -->
  <main class="map">
    <svg id="graph"></svg>
    <div class="map-toolbar">
      <button class="map-btn" id="btn-zoom-in" title="放大">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="map-btn" id="btn-zoom-out" title="縮小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="map-btn" id="btn-fit" title="重置視角">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4"/><path d="M20 8V4h-4"/><path d="M4 16v4h4"/><path d="M20 16v4h-4"/></svg>
      </button>
      <button class="map-btn" id="btn-pause" title="凍結/解凍布局">
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><polygon points="6,4 20,12 6,20"/></svg>
      </button>
      <button class="map-btn active" id="btn-rings" title="顯示/隱藏狀態環">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      </button>
      <button class="map-btn" id="btn-clear" title="清除選擇">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div class="trail-stepper" id="trail-stepper" style="display:none;"></div>
    <div class="map-status" id="map-status">載入中...</div>
    <div class="error-banner" id="error-banner" style="display:none;">
      <div>
        <h2>⚠️ 資料載入失敗</h2>
        <p id="error-detail" style="margin-top:14px; color:var(--muted); font-size:11px;"></p>
      </div>
    </div>
  </main>
</div>

}

<script>
// ============================================================
// Visual encoding (redundant: hue × shape × border)
// ============================================================
const NODE_TYPE_VIS = {
  concept: { color: 'var(--n-concept)', shape: 'circle',    label: '概念', semantic: '穩定/結構' },
  action:  { color: 'var(--n-action)',  shape: 'diamond',   label: '操作', semantic: '判斷/執行' },
  tool:    { color: 'var(--n-tool)',    shape: 'hexagon',   label: '工具', semantic: '輔助/手段' },
  risk:    { color: 'var(--n-risk)',    shape: 'octagon',   label: '風險', semantic: '警示/阻斷' },
  output:  { color: 'var(--n-output)',  shape: 'rectangle', label: '結果', semantic: '收斂/價值' },
};

const EDGE_TYPE_VIS = {
  foundation: { color: 'var(--e-foundation)', dash: null,        label: '基礎' },
  depends_on: { color: 'var(--e-depends_on)', dash: null,        label: '依賴' },
  influences: { color: 'var(--e-influences)', dash: '4,4',       label: '影響' },
  extends:    { color: 'var(--e-extends)',    dash: null,        label: '延伸' },
  contains:   { color: 'var(--e-contains)',   dash: null,        label: '包含' },
  blocks:     { color: 'var(--e-blocks)',     dash: '6,3',       label: '阻礙' },
  validates:  { color: 'var(--e-validates)',  dash: '2,3',       label: '驗證' },
};

// Shape path generators centered at (0,0). r = "radius" hint.
const SHAPE_PATH = {
  circle:    (r) => `M${-r},0 a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0 Z`,
  diamond:   (r) => `M0,${-r*1.15} L${r*1.05},0 L0,${r*1.15} L${-r*1.05},0 Z`,
  hexagon:   (r) => {
    const s = r * 1.05; const h = s * 0.866;
    return `M${-s/2},${-h} L${s/2},${-h} L${s},0 L${s/2},${h} L${-s/2},${h} L${-s},0 Z`;
  },
  octagon:   (r) => {
    const s = r * 0.95, a = s * 0.414;
    return `M${-a},${-s} L${a},${-s} L${s},${-a} L${s},${a} L${a},${s} L${-a},${s} L${-s},${a} L${-s},${-a} Z`;
  },
  rectangle: (r) => {
    const w = r * 1.4, h = r * 0.95, rx = 6;
    return `M${-w+rx},${-h} h${2*(w-rx)} a${rx},${rx} 0 0 1 ${rx},${rx} v${2*(h-rx)} a${rx},${rx} 0 0 1 ${-rx},${rx} h${-2*(w-rx)} a${rx},${rx} 0 0 1 ${-rx},${-rx} v${-2*(h-rx)} a${rx},${rx} 0 0 1 ${rx},${-rx} Z`;
  },
};

const NODE_R = 28;

// ============================================================
// Bootstrap
// ============================================================
const STATE = {
  graph: null,
  ontology: null,
  resources: null,
  progress: null,
  selectedNode: null,
  selectedTrail: null,
  sim: null,
  simPaused: false,
  ringsVisible: true,
};

const STATUS_LABELS = {
  not_started: '未開始',
  in_progress: '進行中',
  completed:   '完成',
  stuck:       '卡關',
};
const STATUS_COLORS = {
  completed:   'var(--green)',
  in_progress: 'var(--blue)',
  stuck:       'var(--red)',
};

function progressKey() { return `nobooktomap_progress_${STATE.graph.meta.id}`; }

function loadStoredProgress(inline) {
  try {
    const raw = localStorage.getItem(`nobooktomap_progress_${inline?.graph_id || STATE.graph?.meta?.id}`);
    if (raw) return JSON.parse(raw);
  } catch {}
  return inline;
}

function saveProgress() {
  if (!STATE.progress || !STATE.graph) return;
  STATE.progress.updated_at = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem(progressKey(), JSON.stringify(STATE.progress, null, 2)); } catch {}
}

function setNodeStatus(nodeId, status) {
  if (!STATE.progress) {
    STATE.progress = {
      schema: 'progress/v1',
      graph_id: STATE.graph.meta.id,
      nodes: {},
      trails: {},
    };
  }
  STATE.progress.nodes = STATE.progress.nodes || {};
  const prev = STATE.progress.nodes[nodeId] || {};
  STATE.progress.nodes[nodeId] = {
    ...prev,
    status,
    last_touched: new Date().toISOString().slice(0, 10),
  };
  saveProgress();
  refreshNodeRing(nodeId, status);
  if (STATE.selectedNode?.id === nodeId) {
    STATE.selectedNode.status = status;
    renderDetail(STATE.selectedNode);
  }
  updateProgress();
  renderTrailStepper();
}

function refreshNodeRing(nodeId, status) {
  const svg = d3.select('#graph');
  const g = svg.selectAll('g.node').filter(d => d.id === nodeId);
  g.select('circle.status-ring').remove();
  g.datum().status = status;
  if (status === 'completed' || status === 'in_progress' || status === 'stuck') {
    g.insert('circle', '.node-shape')
      .attr('class', 'status-ring')
      .attr('r', NODE_R + 5)
      .attr('fill', 'none')
      .attr('stroke', STATUS_COLORS[status])
      .attr('stroke-width', 2)
      .attr('stroke-dasharray', status === 'in_progress' ? '3,3' : null)
      .attr('opacity', 0.7)
      .style('display', STATE.ringsVisible ? null : 'none');
  }
}

function toggleRings() {
  STATE.ringsVisible = !STATE.ringsVisible;
  d3.select('#graph').selectAll('circle.status-ring')
    .style('display', STATE.ringsVisible ? null : 'none');
  document.getElementById('btn-rings').classList.toggle('active', STATE.ringsVisible);
}

// Single-file mode: data embedded inline (see <script id="lm-data"> at bottom of body).
// To update data: edit corresponding .json file, then paste back into the inline block.
(function init() {
  try {
    const raw = document.getElementById('lm-data').textContent;
    const data = JSON.parse(raw);
    STATE.graph     = data.graph;
    STATE.ontology  = data.ontology;
    STATE.resources = data.resources;
    STATE.progress  = loadStoredProgress(data.progress || null);
    renderAll();
    // P1: fade out loading splash after first paint (with small intentional delay so it's perceivable)
    setTimeout(() => {
      const splash = document.getElementById('loading-splash');
      if (splash) splash.classList.add('hidden');
    }, 250);
  } catch (err) {
    showError(err);
  }
})();

function showError(err) {
  document.getElementById('error-banner').style.display = 'flex';
  document.getElementById('error-detail').textContent = String(err);
  document.getElementById('map-status').textContent = '載入失敗';
}

// ============================================================
// Render
// ============================================================
function renderAll() {
  renderHeader();
  renderTrails();
  renderLegend();
  renderGraph();
  updateProgress();
}

function renderHeader() {
  document.getElementById('title').textContent   = STATE.graph.meta.title;
  document.getElementById('summary').textContent = STATE.graph.meta.summary || '';
}

function renderTrails() {
  const root = document.getElementById('trail-list');
  root.innerHTML = '';
  STATE.graph.trails.forEach(trail => {
    const btn = document.createElement('button');
    btn.className = 'trail-button';
    btn.innerHTML = `<strong>${escapeHTML(trail.name)}</strong><span>${escapeHTML(trail.intent)}</span>`;
    btn.addEventListener('click', () => selectTrail(trail));
    root.appendChild(btn);
  });
}

function renderLegend() {
  // Nodes
  const nodes = document.getElementById('legend-nodes');
  nodes.innerHTML = '';
  Object.entries(NODE_TYPE_VIS).forEach(([type, vis]) => {
    const row = document.createElement('div');
    row.className = 'legend-item';
    row.innerHTML = `
      <span class="legend-swatch">
        <svg viewBox="-16 -16 32 32">
          <path d="${SHAPE_PATH[vis.shape](12)}" fill="${vis.color}" opacity="0.85"
                stroke="${vis.color}" stroke-width="${type==='risk'?3:1.5}"/>
        </svg>
      </span>
      <span><strong style="color:var(--text);">${vis.label}</strong> · ${vis.semantic}</span>
    `;
    nodes.appendChild(row);
  });
  // Edges
  const edges = document.getElementById('legend-edges');
  edges.innerHTML = '';
  Object.entries(EDGE_TYPE_VIS).forEach(([type, vis]) => {
    const row = document.createElement('div');
    row.className = 'legend-item';
    row.innerHTML = `
      <span class="legend-swatch">
        <svg viewBox="0 0 24 12">
          <line x1="2" y1="6" x2="22" y2="6"
                stroke="${vis.color}" stroke-width="2"
                ${vis.dash ? `stroke-dasharray="${vis.dash}"` : ''}/>
        </svg>
      </span>
      <span>${vis.label} <span style="color:var(--muted);">(${type})</span></span>
    `;
    edges.appendChild(row);
  });
}

// ============================================================
// Graph rendering (D3 force layout)
// ============================================================
function renderGraph() {
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();
  const { width, height } = svg.node().getBoundingClientRect();

  // Marker defs (arrowheads per edge type)
  const defs = svg.append('defs');
  Object.entries(EDGE_TYPE_VIS).forEach(([type, vis]) => {
    defs.append('marker')
      .attr('id', `arrow-${type}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 14)
      .attr('refY', 0)
      .attr('markerWidth', 7)
      .attr('markerHeight', 7)
      .attr('orient', 'auto')
      .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', vis.color);
  });

  // Zoomable group
  const root = svg.append('g').attr('class', 'root');
  const zoom = d3.zoom()
    .scaleExtent([0.3, 3])
    .on('zoom', (e) => root.attr('transform', e.transform));
  svg.call(zoom);

  // Fixed initial layout (fraction of canvas width/height)
  // 成品在最右、進料在最左、NG桶在下方
  const FIXED_POS = {
    part_check:       { x: 0.05, y: 0.72 },
    vibration_bowl:   { x: 0.18, y: 0.65 },
    muffler:          { x: 0.24, y: 0.78 },
    retainer_plug:    { x: 0.32, y: 0.55 },
    nachi_robot:      { x: 0.30, y: 0.32 },
    parts_assembly:   { x: 0.40, y: 0.57 },
    safety_stop:      { x: 0.22, y: 0.18 },
    dispense_needle:  { x: 0.52, y: 0.50 },
    vc3_glue:         { x: 0.48, y: 0.28 },
    dilution_ratio:   { x: 0.52, y: 0.10 },
    sensor:           { x: 0.64, y: 0.44 },
    fill_rate_75:     { x: 0.73, y: 0.36 },
    press_cylinder:   { x: 0.82, y: 0.24 },
    finished_product: { x: 0.93, y: 0.14 },
    ng_bin_assembly:  { x: 0.42, y: 0.88 },
    ng_bin_glue:      { x: 0.82, y: 0.68 },
  };

  // Prepare data
  const nodes = Object.entries(STATE.graph.nodes).map(([id, n]) => {
    const pos = FIXED_POS[id];
    return {
      id,
      ...n.core,
      detail: n.detail,
      extra: n.extra,
      status: STATE.progress?.nodes?.[id]?.status || 'not_started',
      fx: pos ? pos.x * width : undefined,
      fy: pos ? pos.y * height : undefined,
    };
  });
  // D3 forceLink expects `source`/`target`; our schema uses `from`/`to`. Bridge here.
  const edges = STATE.graph.edges.map(e => ({ ...e, source: e.from, target: e.to }));

  // Force simulation
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => 130 - (d.weight ?? 0.5) * 30).strength(d => 0.3 + (d.weight ?? 0.5) * 0.5))
    .force('charge', d3.forceManyBody().strength(-450))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide(NODE_R + 12))
    .alphaDecay(1); // 固定排版：所有節點已設定 fx/fy，立即停止模擬
  STATE.sim = sim;

  // Edges
  const edgeSel = root.append('g').attr('class', 'edges')
    .selectAll('path')
    .data(edges)
    .join('path')
      .attr('class', 'edge')
      .attr('stroke', d => EDGE_TYPE_VIS[d.type].color)
      .attr('stroke-width', d => 1 + (d.weight ?? 0.5) * 2.5)
      .attr('stroke-dasharray', d => EDGE_TYPE_VIS[d.type].dash || null)
      .attr('opacity', d => 0.4 + (d.weight ?? 0.5) * 0.5)
      .attr('marker-end', d => `url(#arrow-${d.type})`);

  // Edge labels
  const edgeLabelSel = root.append('g').attr('class', 'edge-labels')
    .selectAll('text')
    .data(edges)
    .join('text')
      .attr('class', 'edge-label')
      .text(d => d.label);

  // Nodes (group with shape + label + feynman)
  const nodeSel = root.append('g').attr('class', 'nodes')
    .selectAll('g.node')
    .data(nodes)
    .join('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', dragStart)
        .on('drag', dragMove)
        .on('end', dragEnd))
      .on('click', (event, d) => { event.stopPropagation(); selectNode(d); });

  nodeSel.append('path')
    .attr('class', d => `node-shape ${d.type === 'risk' ? 'risk' : ''}`)
    .attr('d', d => SHAPE_PATH[NODE_TYPE_VIS[d.type].shape](NODE_R))
    .attr('fill', d => NODE_TYPE_VIS[d.type].color)
    .attr('fill-opacity', 0.18)
    .attr('stroke', d => NODE_TYPE_VIS[d.type].color)
    .attr('color', d => NODE_TYPE_VIS[d.type].color);

  // Status ring overlay
  nodeSel.filter(d => d.status === 'completed' || d.status === 'in_progress' || d.status === 'stuck')
    .append('circle')
      .attr('class', 'status-ring')
      .attr('r', NODE_R + 5)
      .attr('fill', 'none')
      .attr('stroke', d => STATUS_COLORS[d.status])
      .attr('stroke-width', 2)
      .attr('stroke-dasharray', d => d.status === 'in_progress' ? '3,3' : null)
      .attr('opacity', 0.7)
      .style('display', STATE.ringsVisible ? null : 'none');

  nodeSel.append('text')
    .attr('class', 'node-label')
    .each(function(d) {
      const sel = d3.select(this);
      if (d.name_en) {
        sel.append('tspan').attr('x', 0).attr('dy', '-0.1em').text(d.name);
        sel.append('tspan').attr('class', 'name-en').attr('x', 0).attr('dy', '1.15em').text(d.name_en);
      } else {
        sel.append('tspan').attr('x', 0).attr('dy', '0.35em').text(d.name);
      }
    });

  // (canvas-level feynman removed — keep canvas clean, full feynman lives in detail panel)

  // Tick
  sim.on('tick', () => {
    edgeSel.attr('d', d => curvedPath(d));
    edgeLabelSel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2 - 4);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  function dragStart(event, d) { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
  function dragMove(event, d)  { d.fx = event.x; d.fy = event.y; }
  function dragEnd(event, d)   { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }

  // Background click → clear selection
  svg.on('click', () => clearSelection());

  // Toolbar
  document.getElementById('btn-zoom-in').onclick  = () => svg.transition().call(zoom.scaleBy, 1.3);
  document.getElementById('btn-zoom-out').onclick = () => svg.transition().call(zoom.scaleBy, 1/1.3);
  document.getElementById('btn-fit').onclick      = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
  document.getElementById('btn-pause').onclick    = togglePause;
  document.getElementById('btn-rings').onclick    = toggleRings;
  document.getElementById('btn-clear').onclick    = clearAllSelections;

  document.getElementById('map-status').textContent =
    `${nodes.length} 節點 · ${edges.length} 邊 · ${STATE.graph.trails.length} 路徑`;
}

function curvedPath(d) {
  // gentle arc; offset so two opposing edges don't overlap
  const dx = d.target.x - d.source.x;
  const dy = d.target.y - d.source.y;
  const dr = Math.sqrt(dx*dx + dy*dy) * 1.8;
  return `M${d.source.x},${d.source.y} A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
}

function togglePause() {
  STATE.simPaused = !STATE.simPaused;
  const btn = document.getElementById('btn-pause');
  const pauseIcon = btn.querySelector('.icon-pause');
  const playIcon  = btn.querySelector('.icon-play');
  if (STATE.simPaused) {
    STATE.sim.stop();
    pauseIcon.style.display = 'none';
    playIcon.style.display  = 'block';
    btn.title = '解凍布局';
  } else {
    STATE.sim.alphaTarget(0.1).restart();
    pauseIcon.style.display = 'block';
    playIcon.style.display  = 'none';
    btn.title = '凍結布局';
  }
}

// ============================================================
// Selection / highlighting
// ============================================================
function selectNode(node) {
  STATE.selectedNode = node;
  renderDetail(node);
  applyHighlight();
  renderTrailStepper();
}

function selectTrail(trail) {
  STATE.selectedTrail = (STATE.selectedTrail?.name === trail.name) ? null : trail;
  document.querySelectorAll('.trail-button').forEach((b, i) => {
    b.classList.toggle('active', STATE.graph.trails[i] === STATE.selectedTrail);
  });
  applyHighlight();
  updateProgress();
  renderTrailStepper();
}

// P2: Trail stepper bar — shows trail step order with arrows; click to focus a node
function renderTrailStepper() {
  const stepper = document.getElementById('trail-stepper');
  if (!STATE.selectedTrail) {
    stepper.style.display = 'none';
    stepper.innerHTML = '';
    return;
  }
  const trail = STATE.selectedTrail;
  const parts = [`<span class="stepper-trail-name">${escapeHTML(trail.name)}</span>`];
  trail.steps.forEach((s, i) => {
    const node = STATE.graph.nodes[s.node];
    if (!node) return;
    const status = STATE.progress?.nodes?.[s.node]?.status || 'not_started';
    const isSel = STATE.selectedNode?.id === s.node;
    const cls = [
      'stepper-step',
      isSel ? 'selected' : '',
      status === 'completed' ? 'completed' : '',
      status === 'stuck'     ? 'stuck'     : ''
    ].filter(Boolean).join(' ');
    parts.push(`
      <span class="${cls}" data-node-id="${escapeHTML(s.node)}">
        <span class="step-num">${i + 1}</span>
        <span>${escapeHTML(node.core.name)}</span>
      </span>
    `);
    if (i < trail.steps.length - 1) parts.push('<span class="step-arrow">→</span>');
  });
  stepper.innerHTML = parts.join('');
  stepper.style.display = 'flex';
}

function clearSelection() {
  STATE.selectedNode = null;
  applyHighlight();
}

// Full reset: clear node, trail, and detail panel (toolbar ✕ button)
function clearAllSelections() {
  STATE.selectedNode = null;
  STATE.selectedTrail = null;
  document.querySelectorAll('.trail-button').forEach(b => b.classList.remove('active'));
  document.getElementById('detail').innerHTML = `
    <div class="detail-empty">
      <h2>👈 點擊地圖上的節點查看詳情</h2>
      <p style="margin-top:12px;">
        每個節點預設只顯示「名稱 + 比喻 + 類型」，點擊下方折疊區可漸進展開細節與額外補充。
      </p>
    </div>`;
  applyHighlight();
  updateProgress();
}

function applyHighlight() {
  const svg = d3.select('#graph');
  const trail = STATE.selectedTrail;
  const sel = STATE.selectedNode;

  // Build "relevant" id set based on selection mode
  let relevantIds = null;
  if (trail) {
    relevantIds = new Set(trail.steps.map(s => s.node));
  } else if (sel) {
    // Single-node mode: relevant = selected + direct neighbors (in/out)
    relevantIds = new Set([sel.id]);
    STATE.graph.edges.forEach(e => {
      if (e.from === sel.id) relevantIds.add(e.to);
      if (e.to   === sel.id) relevantIds.add(e.from);
    });
  }

  // Edge endpoints are resolved to node objects by d3.forceLink at runtime;
  // when no selection is active, nothing is dimmed.
  svg.selectAll('g.node').each(function(d) {
    const isSel  = sel && d.id === sel.id;
    const dimmed = relevantIds ? (!relevantIds.has(d.id) && !isSel) : false;
    d3.select(this).select('.node-shape')
      .classed('selected', isSel)
      .classed('dimmed', dimmed);
    d3.select(this).select('.node-label').classed('dimmed', dimmed);
  });

  svg.selectAll('path.edge').each(function(d) {
    const sid = d.source.id || d.source;
    const tid = d.target.id || d.target;
    const dimmed = relevantIds ? !(relevantIds.has(sid) && relevantIds.has(tid)) : false;
    d3.select(this).classed('dimmed', dimmed);
  });
  svg.selectAll('text.edge-label').each(function(d) {
    const sid = d.source.id || d.source;
    const tid = d.target.id || d.target;
    const dimmed = relevantIds ? !(relevantIds.has(sid) && relevantIds.has(tid)) : false;
    d3.select(this).classed('dimmed', dimmed);
  });
}

// ============================================================
// Detail panel
// ============================================================
function renderDetail(node) {
  const root = document.getElementById('detail');
  const vis = NODE_TYPE_VIS[node.type];
  const status = node.status;

  const aliases = (node.aliases || []).map(a => `<span class="tag">${escapeHTML(a)}</span>`).join('');
  const tags    = (node.tags    || []).map(t => `<span class="tag">#${escapeHTML(t)}</span>`).join('');

  const resources = (node.detail.resources || []).map(rid => {
    const [resId, chunk] = rid.split('#');
    const res = STATE.resources?.resources?.find(r => r.id === resId);
    const title = res ? res.title : resId;
    return `<span class="resource-chip" title="${escapeHTML(res?.url || '')}">${escapeHTML(title)}${chunk ? ` · ${chunk}` : ''}</span>`;
  }).join('');

  const extra = node.extra || {};
  const extraParts = [];
  if (extra.tips)          extraParts.push(`<div><span class="label">Tips</span><p style="margin-top:6px;">${escapeHTML(extra.tips)}</p></div>`);
  if (extra.misconception) extraParts.push(`<div style="margin-top:10px;"><span class="label">Misconception</span><p style="margin-top:6px; color:var(--orange);">${escapeHTML(extra.misconception)}</p></div>`);
  if (extra.definition)    extraParts.push(`<div style="margin-top:10px;"><span class="label">Definition</span><p style="margin-top:6px;">${escapeHTML(extra.definition)}</p></div>`);
  if (extra.examples)      extraParts.push(`<div style="margin-top:10px;"><span class="label">Examples</span><ul>${extra.examples.map(e => `<li>${escapeHTML(e)}</li>`).join('')}</ul></div>`);

  root.innerHTML = `
    <span class="node-type-chip" style="color:${vis.color}; background:${vis.color}26;">
      ${vis.label} · ${escapeHTML(node.type)}
    </span>
    <h2>${escapeHTML(node.name)}
      <span class="status-badge status-${status}">${STATUS_LABELS[status]}</span>
    </h2>
    ${node.name_en ? `<div class="detail-name-en">${escapeHTML(node.name_en)}</div>` : ''}
    ${(aliases || tags) ? `<div class="tags">${aliases}${tags}</div>` : ''}

    <div class="feynman">${escapeHTML(node.feynman)}</div>

    ${node.type === 'risk' ? `
      <div class="risk-alert">
        <span class="label">常見誤解 / 風險點</span>
        ${escapeHTML(node.detail.common_confusion)}
      </div>
    ` : ''}

    <div class="status-controls">
      <span class="label">學習狀態</span>
      <div class="status-btns" data-node-id="${escapeHTML(node.id)}">
        <button data-status="not_started" class="${status==='not_started'?'active':''}">未開始</button>
        <button data-status="in_progress" class="${status==='in_progress'?'active':''}">進行中</button>
        <button data-status="completed"   class="${status==='completed'  ?'active':''}">完成</button>
        <button data-status="stuck"       class="${status==='stuck'      ?'active':''}">卡關</button>
      </div>
    </div>

    <details open>
      <summary>Detail · 詳細說明</summary>
      <div>
        <p>${escapeHTML(node.detail.detail)}</p>

        <div style="margin-top:14px;"><span class="label">Actions</span>
          <ul>${node.detail.actions.map(a => `<li>${escapeHTML(a)}</li>`).join('')}</ul>
        </div>

        <div style="margin-top:14px;"><span class="label">Common Confusion</span>
          <p class="confusion" style="margin-top:6px;">${escapeHTML(node.detail.common_confusion)}</p>
        </div>

        <div style="margin-top:14px;"><span class="label">Checkpoints</span>
          <ul>${node.detail.checkpoints.map(c => `<li>${escapeHTML(c)}</li>`).join('')}</ul>
        </div>

        ${resources ? `<div style="margin-top:14px;"><span class="label">Resources</span><div class="resources">${resources}</div></div>` : ''}
      </div>
    </details>

    ${extraParts.length ? `
      <details>
        <summary>Extra · 額外補充</summary>
        <div>${extraParts.join('')}</div>
      </details>
    ` : ''}
  `;
}

// ============================================================
// Progress
// ============================================================
function updateProgress() {
  const block = document.getElementById('progress-block');
  if (!STATE.progress) { block.style.display = 'none'; return; }
  block.style.display = 'block';

  let total, done;
  if (STATE.selectedTrail) {
    const ids = STATE.selectedTrail.steps.map(s => s.node);
    total = ids.length;
    done = ids.filter(id => STATE.progress.nodes?.[id]?.status === 'completed').length;
    document.getElementById('progress-label').textContent = STATE.selectedTrail.name;
  } else {
    const ids = Object.keys(STATE.graph.nodes);
    total = ids.length;
    done = ids.filter(id => STATE.progress.nodes?.[id]?.status === 'completed').length;
    document.getElementById('progress-label').textContent = '整體進度';
  }
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-pct').textContent = `${done}/${total} · ${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ============================================================
// Utils
// ============================================================
function escapeHTML(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Detail panel: delegate clicks for status buttons
document.getElementById('detail').addEventListener('click', (e) => {
  const btn = e.target.closest('.status-btns button');
  if (!btn) return;
  const wrap = btn.closest('.status-btns');
  const nodeId = wrap?.dataset.nodeId;
  const status = btn.dataset.status;
  if (nodeId && status) setNodeStatus(nodeId, status);
});

// Trail stepper: delegate clicks to focus a node
document.getElementById('trail-stepper').addEventListener('click', (e) => {
  const step = e.target.closest('.stepper-step');
  if (!step) return;
  const nodeId = step.dataset.nodeId;
  const nodeData = d3.select('#graph').selectAll('g.node').data().find(d => d.id === nodeId);
  if (nodeData) selectNode(nodeData);
});

// Handle resize
window.addEventListener('resize', () => {
  if (STATE.graph) renderGraph();
});
</script>
